
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little Universe 🌙</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="language-switch">
        <button onclick="setLanguage('en')">🇬🇧 EN</button>
        <button onclick="setLanguage('fr')">🇨🇦 FR</button>
    </div>

    <div class="stars"></div>

    <main class="container">

        <div class="moon">🌙</div>

        <p class="small-title" id="subtitle">
            A LITTLE WORLD, MADE JUST FOR YOU
        </p>

        <h1 id="title">
            Welcome to<br>
            My Soul
        </h1>

        <div class="photo-frame">
            <img src="images/imagesphoto1.jpg" alt="Our photo">
        </div>

        <p class="description" id="description">
            Somewhere in this universe,<br>
            there's someone who makes my days brighter.
        </p>

        <p class="sunshine" id="sunshine">
            My Sunshine ☀️
        </p>

        <button class="enter-button" id="enterButton" onclick="enterUniverse()">
            Enter to My Soul ❤️
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
